[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rosws"
version = "0.1.0"
description = "Git Worktree and ROS Workspace Management Tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "argcomplete>=3.0",
]

[project.scripts]
rosws = "rosws.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
